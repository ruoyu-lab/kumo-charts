# Temporary: checks whether a run gets an OIDC token and npm exchanges it for @kumo-charts/core,
# as release.yml's publishing needs. It publishes nothing and prints no token.
name: OIDC check

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ask GitHub for a token and npm to exchange it
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "No ACTIONS_ID_TOKEN_REQUEST_URL: the run has no id-token permission."
            exit 1
          fi
          token=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          echo "::add-mask::$token"
          echo "GitHub token: ${#token} characters"
          echo "$token" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{repository, workflow_ref, ref, event_name}' || true
          status=$(curl -sS -o answer.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $token" \
            https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@kumo-charts%2fcore)
          echo "npm exchange: HTTP $status"
          jq 'del(.token)' answer.json || true
